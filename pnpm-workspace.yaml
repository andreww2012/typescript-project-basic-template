# shamefullyHoist: true
saveExact: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: []

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

allowBuilds:
  # core-js: false # Donation message
  esbuild: false # Not a direct dependency
  lefthook: true
  unrs-resolver: false # cspell:disable-line

dedupePeers: true
strictPeerDependencies: false

# overrides: {}

peerDependencyRules:
  allowedVersions: {}
