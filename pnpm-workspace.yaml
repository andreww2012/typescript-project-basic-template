# shamefullyHoist: true
saveExact: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: # []
  - eslint@10.11.0
  - eslint-config-un@1.0.0-rc.1
  - knip@6.37.0
  - verkit@0.5.0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

audit:
  ignore: []
  ignorePrune: true

allowBuilds:
  esbuild: false
  lefthook@2.1.14: true
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
